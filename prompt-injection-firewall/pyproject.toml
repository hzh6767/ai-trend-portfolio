[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-firewall"
version = "0.1.0"
description = "Explainable offline prompt-injection scanner"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
prompt-firewall = "prompt_injection_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

