[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-kit"
version = "0.1.0"
description = "Deterministic, offline RAG evaluation metrics"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rag-eval = "rag_eval_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

