[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-output-guard"
version = "0.1.0"
description = "Deterministic schema validation for LLM JSON output"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
structured-output-guard = "structured_output_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
