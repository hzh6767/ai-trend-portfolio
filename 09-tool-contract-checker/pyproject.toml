[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-contract-checker"
version = "0.1.0"
description = "Offline agent tool contract and argument safety checker"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tool-contract-check = "tool_contract_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
