[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-cache-sim"
version = "0.1.0"
description = "Deterministic offline semantic cache simulation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
semantic-cache-sim = "semantic_cache_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
