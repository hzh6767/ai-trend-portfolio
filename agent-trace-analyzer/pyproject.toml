[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-analyzer"
version = "0.1.0"
description = "Offline observability reports for LLM agent traces"
requires-python = ">=3.10"

[project.scripts]
agent-trace-analyzer = "agent_trace_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
